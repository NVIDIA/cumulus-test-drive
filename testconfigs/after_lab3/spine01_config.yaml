- set:
    interface:
      lo:
        ip:
          address:
            10.255.255.101/32: {}
        type: loopback
      swp1-2:
        link:
          state:
            up: {}
        type: swp
      swp1.100:
        base-interface: swp1
      swp1.100,swp2.100:
        ip:
          vrf: RED
        type: sub
        vlan: 100
      swp2.100:
        base-interface: swp2
    router:
      bgp:
        enable: on
        router-id: 10.255.255.101
    vrf:
      RED:
        router:
          bgp:
            autonomous-system: 65201
            enable: on
            neighbor:
              swp1.100:
                remote-as: external
                type: unnumbered
              swp2.100:
                remote-as: external
                type: unnumbered
            path-selection:
              multipath:
                aspath-ignore: on
        table: auto
      default:
        router:
          bgp:
            address-family:
              ipv4-unicast:
                enable: on
                network:
                  10.255.255.101/32: {}
            autonomous-system: 65201
            enable: on
            neighbor:
              swp1:
                remote-as: external
                type: unnumbered
              swp2:
                remote-as: external
                type: unnumbered
            path-selection:
              multipath:
                aspath-ignore: on